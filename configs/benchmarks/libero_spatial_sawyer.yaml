server:
  url: "ws://localhost:8000"
docker:
  image: swr.cn-north-4.myhuaweicloud.com/link-seek/vla-eval-libero:latest
# NOTE: eval_vla.py runs INSIDE the eval container, so vla-eval skips its own
# docker launch and runs the benchmark in-process. The robot switch comes from
# robot-switch.yml, which file-patches the robots=["Panda"] default to
# robots=["Sawyer"] (see scripts/patch_env_wrapper.py) and mounts the result
# over the image copy. docker.image above is kept for documentation only.
output_dir: "/data/eval/results/libero_spatial_sawyer"
benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_spatial_sawyer
    episodes_per_task: 1
    params:
      suite: libero_spatial
      seed: 7
      num_steps_wait: 10
