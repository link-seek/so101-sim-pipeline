server:
  url: "ws://localhost:8000"
docker:
  image: swr.cn-north-4.myhuaweicloud.com/link-seek/vla-eval-libero-pro:latest
output_dir: "/data/eval/results/libero_pro_object"
benchmarks:
  - benchmark: "vla_eval.benchmarks.libero_pro.benchmark:LIBEROProBenchmark"
    subname: libero_spatial_object
    episodes_per_task: 50
    params:
      suite: libero_spatial
      perturbation: object
      seed: 7
      num_steps_wait: 10
