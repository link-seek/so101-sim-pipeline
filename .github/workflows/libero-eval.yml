name: LIBERO Eval

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Checkpoint path on ECS"
        required: false
        default: "/data/checkpoints/smolvla-sim/checkpoints/015000/pretrained_model"
      benchmarks:
        description: "Comma-separated benchmark names"
        required: false
        default: "libero_object"
      episodes_per_task:
        description: "Episodes per task"
        required: false
        default: "10"

permissions:
  contents: write
  packages: read

env:
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-eval:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          # BatchStartServers returns accepted (async): verify power state, or the
          # self-hosted job queues forever on a stopped box with zero diagnostics.
          for i in $(seq 1 30); do
            # NOTE: read calls need the same explicit keys (runner has no hcloud profile).
            ST=$(hcloud ECS ListServersDetails --cli-region="${{ env.ECS_REGION }}" --limit=50 \
              --cli-access-key="${{ secrets.OBS_AK }}" --cli-secret-key="${{ secrets.OBS_SK }}" 2>&1 \
              | python3 -c "import json,sys; raw=sys.stdin.read(); d=json.loads(raw[raw.find('{'):]); print([ (s['status'],s['OS-EXT-STS:vm_state']) for s in d.get('servers',[]) if s.get('id')=='${{ env.ECS_SERVER_ID }}' ][0][1])" 2>/dev/null || echo unknown)
            echo "power_state=$ST (try $i/30)"
            [ "$ST" = "active" ] && break
            sleep 20
          done
          [ "$ST" = "active" ] || { echo "V100 did not reach active"; exit 1; }

  evaluate:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 120
    steps:
      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Pull latest image
        run: docker pull ${{ env.EVAL_IMAGE }}

      - name: Configure obsutil
        run: |
          obsutil config -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -e https://obs.cn-north-4.myhuaweicloud.com
          obsutil ls obs://${{ env.OBS_BUCKET }}/ 2>&1 | head -n 5 || true

      - name: Fetch latest eval script
        run: |
          mkdir -p /data/eval/libero_results
          mkdir -p "${RUNNER_TEMP}/scripts"
          for f in run_libero_eval.py; do
            curl -sfL --max-time 60 -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/scripts/${f}?ref=smolvla-fresh" \
              | python3 -c "import sys,json,base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)['content']).decode())" \
              > "${RUNNER_TEMP}/scripts/${f}"
          done
          wc -l "${RUNNER_TEMP}/scripts/"*.py
          date '+[%F %T] pkg fetch start'
          mkdir -p "${RUNNER_TEMP}/pkg"
          if timeout -k 60 600 git clone --depth 1 --branch smolvla-fresh --filter=blob:none --sparse \
              "https://github.com/${{ github.repository }}.git" "${RUNNER_TEMP}/pkg/so101pkg" 2>/dev/null; then
            timeout -k 60 600 git -C "${RUNNER_TEMP}/pkg/so101pkg" sparse-checkout set robosuite_so101
          else
            curl -sfL --max-time 300 -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/tarball/smolvla-fresh" \
              | tar -xz -C "${RUNNER_TEMP}/pkg" --strip-components=1 --wildcards '*/robosuite_so101'
          fi
          PKG=$(dirname $(find "${RUNNER_TEMP}/pkg" -maxdepth 3 -name so101_robot.py | head -n 1))
          test -n "$PKG" && ls "$PKG"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          date '+[%F %T] pkg ready'

      - name: Run LIBERO evaluation
        run: |
          date '+[%F %T] eval start'
          timeout -k 120 2400 docker run --rm --gpus all --shm-size=8g \
            -v /data:/data \
            -v "${RUNNER_TEMP}/scripts/run_libero_eval.py:/workspace/scripts/run_libero_eval.py:ro" \
            -v "${{ env.PKG }}:/workspace/robosuite_so101:ro" \
            -e MUJOCO_GL=egl \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_HUB_DISABLE_XET=1 \
            ${{ env.EVAL_IMAGE }} \
            bash -c 'set -e;
              date "+[%F %T] asset install";
              ROBOSUITE_ASSETS="$(dirname $(python -c "import robosuite; print(robosuite.__file__)"))/models/assets";
              mkdir -p $ROBOSUITE_ASSETS/robots/so101/meshes $ROBOSUITE_ASSETS/grippers/meshes/so101_gripper;
              cp /workspace/robosuite_so101/robots/so101/robot.xml $ROBOSUITE_ASSETS/robots/so101/;
              cp -r /workspace/robosuite_so101/robots/so101/meshes/* $ROBOSUITE_ASSETS/robots/so101/meshes/;
              cp /workspace/robosuite_so101/grippers/so101_gripper.xml $ROBOSUITE_ASSETS/grippers/;
              cp -r /workspace/robosuite_so101/grippers/meshes/so101_gripper/* $ROBOSUITE_ASSETS/grippers/meshes/so101_gripper/;
              ROBOSUITE_CTRL="$(dirname $(python -c "import robosuite; print(robosuite.__file__)"))/controllers/configs/robots";
              mkdir -p $ROBOSUITE_CTRL;
              cp /workspace/robosuite_so101/controllers/so101_basic.json $ROBOSUITE_CTRL/default_so101.json;
              date "+[%F %T] asset done";
              python /workspace/scripts/run_libero_eval.py \
              --checkpoint '"'"'${{ inputs.checkpoint }}'"'"' \
              --benchmarks '"'"'${{ inputs.benchmarks }}'"'"' \
              --episodes_per_task ${{ inputs.episodes_per_task }} \
              --output_dir /data/eval/libero_results'
          date '+[%F %T] eval done' 

      - name: Upload results to OBS
        if: always()
        run: |
          obsutil cp /data/eval/libero_results/ obs://${{ env.OBS_BUCKET }}/eval/libero_results/ -f -r -flat || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libero-eval-results
          path: /data/eval/libero_results/

  stop-ecs:
    needs: evaluate
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 60
          exit 0
