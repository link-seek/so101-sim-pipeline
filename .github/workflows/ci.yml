name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install ruff mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: |
          ruff check scripts/ || true
          ruff format --check scripts/ || true

      - name: Type check
        run: |
          mypy scripts/ --ignore-missing-imports || true

      - name: Test
        run: |
          pytest tests/ -v --tb=short || true

  validate-workflows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all workflow files parse and expose triggers
        run: |
          python3 - <<'EOF'
          import glob, sys
          import yaml
          bad = []
          for p in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  d = yaml.safe_load(open(p))
              except Exception as e:
                  bad.append(f"{p}: YAML parse error: {e}")
                  continue
              trig = d.get(True, d.get('on'))
              if not isinstance(trig, dict) or not trig:
                  bad.append(f"{p}: no triggers found")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all workflow files valid")
          EOF

  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build eval Docker image (non-blocking)
        run: |
          if [ -f docker/Dockerfile.eval ]; then
            docker build -f docker/Dockerfile.eval -t so101-eval:latest . || echo "Docker build skipped (likely CUDA base image unavailable on runner)"
          else
            echo "No Dockerfile.eval found, skipping"
          fi
