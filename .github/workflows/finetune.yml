name: Finetune SmolVLA

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: false
        default: "5000"
      batch_size:
        description: "Batch size"
        required: false
        default: "8"
      base_checkpoint:
        description: "Base checkpoint path on ECS (empty = lerobot/smolvla_base from HF)"
        required: false
        default: "/data/checkpoints/smolvla-sim/checkpoints/015000/pretrained_model"
      dataset_mode:
        description: "Dataset source: obs (libero_so101_expert from OBS) or hf (LeRobot dataset from HF mirror)"
        required: false
        default: "obs"
      hf_repo:
        description: "HF dataset repo_id when dataset_mode=hf. MUST have the same 3-camera features as smolvla_base (observation.images.camera1/2/3); e.g. lerobot/libero (2 cams) FAILS with feature-mismatch (#18)"
        required: false
        default: "lerobot/libero"
      output_name:
        description: "Checkpoint subdir under /data/checkpoints/"
        required: false
        default: "smolvla_finetune"
      dataset_root:
        description: "Local dataset root containing the suite subdir (merged or single-leg)"
        required: false
        default: "/data/datasets/libero_so101_expert"

permissions:
  contents: write
  packages: read

env:
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-eval:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          # BatchStartServers returns accepted (async): verify power state, or the
          # self-hosted job queues forever on a stopped box with zero diagnostics.
          for i in $(seq 1 30); do
            # NOTE: read calls need the same explicit keys (runner has no hcloud profile).
            ST=$(hcloud ECS ListServersDetails --cli-region="${{ env.ECS_REGION }}" --limit=50 \
              --cli-access-key="${{ secrets.OBS_AK }}" --cli-secret-key="${{ secrets.OBS_SK }}" 2>&1 \
              | python3 -c "import json,sys; raw=sys.stdin.read(); d=json.loads(raw[raw.find('{'):]); print([ (s['status'],s['OS-EXT-STS:vm_state']) for s in d.get('servers',[]) if s.get('id')=='${{ env.ECS_SERVER_ID }}' ][0][1])" 2>/dev/null || echo unknown)
            echo "power_state=$ST (try $i/30)"
            [ "$ST" = "active" ] && break
            sleep 20
          done
          [ "$ST" = "active" ] || { echo "V100 did not reach active"; exit 1; }

  finetune:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 1500
    steps:
      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Cleanup docker (ECS disk fills with old layers)
        run: |
          docker system prune -af --volumes 2>/dev/null || true
          df -h /data

      - name: Pull latest image
        run: docker pull ${{ env.EVAL_IMAGE }}

      - name: Configure obsutil
        run: |
          obsutil config -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -e https://obs.cn-north-4.myhuaweicloud.com
          obsutil ls obs://${{ env.OBS_BUCKET }}/ 2>&1 | head -n 5 || true

      - name: Download dataset from OBS
        if: inputs.dataset_mode == 'obs'
        run: |
          # OBS 下行有 8 个对象系统性失败（待查）；本地已有数据则直接沿用，不被 OBS 卡死
          obsutil cp obs://${{ env.OBS_BUCKET }}/datasets/libero_so101_expert/ /data/datasets/libero_so101_expert/ -f -r -flat || echo "OBS download partial/failed, fall back to on-disk data"
          find /data/datasets/libero_so101_expert/ -type f | head -10
          du -sh ${{ inputs.dataset_root }}/ 2>/dev/null || du -sh /data/datasets/libero_so101_expert/
          test -n "$(find /data/datasets/libero_so101_expert/ -name '*.parquet' | head -n 1)" || { echo "NO LOCAL DATA either"; exit 1; }
          # Backfill camera axis names in dataset meta (v3.0 writer left names=None;
          # current lerobot requires names[2]=='channel'). Idempotent; also patched in OBS.
          # Runs as container-root: dataset files are root-owned (runner has no sudo).
          docker run --rm -v /data:/data ${{ env.EVAL_IMAGE }} python3 -c "
          import json, glob
          for p in glob.glob('/data/datasets/libero_so101_expert/*/meta/info.json'):
              d = json.load(open(p))
              changed = False
              for k, ft in d.get('features', {}).items():
                  if ft.get('dtype') in ('image', 'video') and not ft.get('names'):
                      ft['names'] = ['height', 'width', 'channel']
                      changed = True
              if changed:
                  json.dump(d, open(p, 'w'), indent=2)
                  print('patched', p)
          "

      - name: Finetune SmolVLA
        run: |
          BASE="${{ inputs.base_checkpoint }}"
          POLICY_ARG=""
          if [ -n "$BASE" ] && [ -d "$BASE" ]; then
            echo "Using local base checkpoint: $BASE"
            POLICY_ARG="--policy.path=$BASE"
          else
            echo "Using lerobot/smolvla_base from HF"
            POLICY_ARG="--policy.path=lerobot/smolvla_base"
          fi
          OUTDIR="/data/checkpoints/${{ inputs.output_name }}"
          DATASET_ARGS=""
          if [ "${{ inputs.dataset_mode }}" = "hf" ]; then
            echo "Using HF dataset: ${{ inputs.hf_repo }} (via mirror)"
            DATASET_ARGS="--dataset.repo_id=${{ inputs.hf_repo }}"
          else
            DATASET_ARGS="--dataset.repo_id=libero_so101_expert --dataset.root=${{ inputs.dataset_root }}/libero_object"
          fi
          # NOTE: do NOT mkdir OUTDIR here — lerobot-train treats an existing
          # output dir as an error (resume=False), even when empty.
          date '+[%F %T] train start'
          timeout -k 300 28800 docker run --rm --gpus "device=0" --shm-size=16g \
            -v /data:/data \
            -e CUDA_VISIBLE_DEVICES=0 \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_HUB_DISABLE_XET=1 \
            -e WANDB_MODE=offline \
            -e PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
            ${{ env.EVAL_IMAGE }} \
            bash -c "pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple 'lerobot[dataset,training]==0.6.1' && \
              lerobot-train \
                $POLICY_ARG \
                $DATASET_ARGS \
                --policy.push_to_hub=false \
                --output_dir=$OUTDIR \
                --steps=${{ inputs.steps }} \
                --batch_size=${{ inputs.batch_size }} \
                --save_freq=1000 \
                --log_freq=50 \
                --num_workers=4"
          date '+[%F %T] train done'

      - name: Upload checkpoints to OBS
        run: |
          obsutil cp /data/checkpoints/${{ inputs.output_name }}/ obs://${{ env.OBS_BUCKET }}/checkpoints/${{ inputs.output_name }}/ -f -r -flat || true

  stop-ecs:
    needs: finetune
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
