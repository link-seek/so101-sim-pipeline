name: Finetune SmolVLA

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: false
        default: "5000"
      batch_size:
        description: "Batch size"
        required: false
        default: "8"
      base_checkpoint:
        description: "Base checkpoint path on ECS (empty = lerobot/smolvla_base from HF)"
        required: false
        default: "/data/checkpoints/smolvla-sim/checkpoints/015000/pretrained_model"
      dataset_mode:
        description: "Dataset source: obs (libero_so101_expert from OBS) or hf (LeRobot dataset from HF mirror)"
        required: false
        default: "obs"
      hf_repo:
        description: "HF dataset repo_id when dataset_mode=hf (e.g. lerobot/libero)"
        required: false
        default: "lerobot/libero"
      output_name:
        description: "Checkpoint subdir under /data/checkpoints/"
        required: false
        default: "smolvla_finetune"

permissions:
  contents: write
  packages: read

env:
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-eval:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 120

  finetune:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 1500
    steps:
      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Cleanup docker (ECS disk fills with old layers)
        run: |
          docker system prune -af --volumes 2>/dev/null || true
          df -h /data

      - name: Pull latest image
        run: docker pull ${{ env.EVAL_IMAGE }}

      - name: Download dataset from OBS
        if: inputs.dataset_mode == 'obs'
        run: |
          obsutil cp obs://${{ env.OBS_BUCKET }}/datasets/libero_so101_expert/ /data/datasets/libero_so101_expert/ -f -r -flat
          find /data/datasets/libero_so101_expert/ -type f | head -10
          du -sh /data/datasets/libero_so101_expert/

      - name: Finetune SmolVLA
        run: |
          BASE="${{ inputs.base_checkpoint }}"
          POLICY_ARG=""
          if [ -n "$BASE" ] && [ -d "$BASE" ]; then
            echo "Using local base checkpoint: $BASE"
            POLICY_ARG="--policy.path=$BASE"
          else
            echo "Using lerobot/smolvla_base from HF"
            POLICY_ARG="--policy.type=smolvla --policy.path=lerobot/smolvla_base"
          fi
          OUTDIR="/data/checkpoints/${{ inputs.output_name }}"
          DATASET_ARGS=""
          if [ "${{ inputs.dataset_mode }}" = "hf" ]; then
            echo "Using HF dataset: ${{ inputs.hf_repo }} (via mirror)"
            DATASET_ARGS="--dataset.repo_id=${{ inputs.hf_repo }}"
          else
            DATASET_ARGS="--dataset.repo_id=libero_so101_expert --dataset.root=/data/datasets/libero_so101_expert/libero_object"
          fi
          mkdir -p "$OUTDIR"
          docker run --rm --gpus "device=0" --shm-size=16g \
            -v /data:/data \
            -e CUDA_VISIBLE_DEVICES=0 \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e WANDB_MODE=offline \
            ${{ env.EVAL_IMAGE }} \
            bash -c "pip install -q 'lerobot[dataset,training]' && \
              lerobot-train \
                $POLICY_ARG \
                $DATASET_ARGS \
                --output_dir=$OUTDIR \
                --steps=${{ inputs.steps }} \
                --batch_size=${{ inputs.batch_size }} \
                --save_freq=1000 \
                --log_freq=50 \
                --num_workers=4"

      - name: Upload checkpoints to OBS
        run: |
          obsutil cp /data/checkpoints/${{ inputs.output_name }}/ obs://${{ env.OBS_BUCKET }}/checkpoints/${{ inputs.output_name }}/ -f -r -flat || true

  stop-ecs:
    needs: finetune
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
