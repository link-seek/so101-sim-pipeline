name: VLA Pipeline

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps"
        required: false
        default: "20000"
      skip_train:
        description: "Skip training, only replay"
        required: false
        default: "false"
      checkpoint:
        description: "Checkpoint path (skip train, use this checkpoint)"
        required: false
        default: ""
  repository_dispatch:
    types: [vla-trigger]

permissions:
  contents: write
  packages: read

env:
  TRAIN_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-train:latest
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-eval:latest
  MODEL_SERVER_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-model-server:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  HF_MODEL_REPO: xieyucheng123/so101-smolvla
  DATASET_REPO: shattori/so101_pick_place_thor
  OBS_BUCKET: so101-sim-pipeline
  RENAME_MAP: '{"observation.images.wrist": "observation.images.camera1", "observation.images.overhead": "observation.images.camera2"}'

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 120

  vla-pipeline:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 1200
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Pull Docker images
        run: |
          docker pull ${{ env.TRAIN_IMAGE }}
          docker pull ${{ env.EVAL_IMAGE }}

      - name: Train SmolVLA
        if: github.event.inputs.skip_train != 'true'
        run: |
          rm -rf /data/checkpoints/smolvla
          docker run --rm --gpus all --shm-size=8g \
            -v /data/checkpoints:/data/checkpoints \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_HUB_DISABLE_XET=1 \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            ${{ env.TRAIN_IMAGE }} \
            python /workspace/scripts/train_smolvla.py \
              --dataset.repo_id=${{ env.DATASET_REPO }} \
              --steps=${{ github.event.inputs.steps || '20000' }} \
              --batch_size=32 \
              --save_freq=5000 \
              --env_eval_freq=2000 \
              --log_freq=500 \
              --wandb.enable=false \
              --policy.push_to_hub=false \
              --rename_map='${{ env.RENAME_MAP }}'

      - name: Find latest checkpoint
        id: checkpoint
        run: |
          CKPT=$(ls -d /data/checkpoints/smolvla/checkpoints/*/pretrained_model 2>/dev/null | sort -t/ -k6 -n | tail -1)
          if [ -z "$CKPT" ]; then
            CKPT="${{ github.event.inputs.checkpoint }}"
          fi
          echo "checkpoint=$CKPT" >> $GITHUB_OUTPUT
          echo "Using checkpoint: $CKPT"

      - name: Simulation replay (record successful episodes)
        run: |
          mkdir -p /data/eval/results
          docker run --rm --gpus all --shm-size=8g \
            -v /data:/data \
            -e MUJOCO_GL=egl \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_HUB_DISABLE_XET=1 \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            ${{ env.EVAL_IMAGE }} \
            python /workspace/scripts/eval_mujoco_policy.py \
              --checkpoint '${{ steps.checkpoint.outputs.checkpoint }}' \
              --mode record \
              --seconds 20 \
              --output /data/eval/results

      - name: Upload to OBS
        if: always()
        run: |
          obsutil cp /data/eval/results/ obs://${{ env.OBS_BUCKET }}/eval/ -f -r -flat
          if [ -d /data/checkpoints/smolvla/checkpoints ]; then
            obsutil cp /data/checkpoints/smolvla/checkpoints/ obs://${{ env.OBS_BUCKET }}/checkpoints/ -f -r -flat
          fi

  stop-ecs:
    needs: vla-pipeline
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 60
          exit 0
