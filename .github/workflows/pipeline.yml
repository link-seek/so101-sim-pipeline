name: SO101 Sim Pipeline

on:
  workflow_dispatch:
    inputs:
      num_episodes:
        description: 'Number of data collection episodes'
        default: '50'
      train_steps:
        description: 'Training steps'
        default: '10000'
      num_eval_episodes:
        description: 'Number of evaluation episodes'
        default: '20'

permissions:
  contents: write

env:
  PYTHON: /data/so101-env/bin/python
  MUJOCO_GL: egl
  HF_ENDPOINT: https://hf-mirror.com
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  OBS_AK: ${{ secrets.OBS_AK }}
  OBS_SK: ${{ secrets.OBS_SK }}
  DATASET_REPO: xieyucheng123/so101-sim-picklift
  HF_MODEL_REPO: xieyucheng123/so101-act-sim
  SCRIPTS_DIR: /data/pipeline/scripts

jobs:
  pipeline:
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 600
    steps:
      - name: Verify environment
        run: |
          $PYTHON -c "import torch; print(f'torch={torch.__version__}, cuda={torch.cuda.is_available()}')"
          $PYTHON -c "import so101_nexus; print(f'so101_nexus={so101_nexus.__version__}')"
          $PYTHON -c "import lerobot; print(f'lerobot={lerobot.__version__}')"
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
          ls $SCRIPTS_DIR/

      - name: Data Collection
        run: |
          $PYTHON $SCRIPTS_DIR/collect_data.py \
            --repo-id $DATASET_REPO \
            --num-episodes ${{ inputs.num_episodes }}

      - name: ACT Training
        run: |
          $PYTHON $SCRIPTS_DIR/train_act.py \
            --dataset-repo $DATASET_REPO \
            --train-steps ${{ inputs.train_steps }}

      - name: Simulation Evaluation
        run: |
          $PYTHON $SCRIPTS_DIR/eval_sim.py \
            --num-episodes ${{ inputs.num_eval_episodes }}

      - name: Render Video
        run: |
          $PYTHON $SCRIPTS_DIR/render_video.py \
            --num-episodes 3

      - name: Upload Results
        run: |
          $PYTHON $SCRIPTS_DIR/upload_results.py \
            --hf-token $HF_TOKEN \
            --hf-repo $HF_MODEL_REPO \
            --obs-ak $OBS_AK \
            --obs-sk $OBS_SK

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -r /data/pipeline/results/* artifacts/ 2>/dev/null || true
