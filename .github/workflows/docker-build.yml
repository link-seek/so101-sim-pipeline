name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'scripts/**'
  schedule:
    - cron: '0 2 * * 1'

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_NAMESPACE: hwstaff_l00392796
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: link-seek

jobs:
  build-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to SWR
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud
          SWR_AUTH=$(hcloud SWR CreateAuthorizationToken \
            --cli-region=cn-north-4 \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['auths']['swr.cn-north-4.myhuaweicloud.com']['auth'])")
          SWR_USER=$(echo "$SWR_AUTH" | base64 -d | cut -d: -f1)
          SWR_PASS=$(echo "$SWR_AUTH" | base64 -d | cut -d: -f2)
          docker login -u "$SWR_USER" -p "$SWR_PASS" ${{ env.SWR_REGISTRY }}

      - name: Build and push train image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-train:latest
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-train:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to SWR
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud
          SWR_AUTH=$(hcloud SWR CreateAuthorizationToken \
            --cli-region=cn-north-4 \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['auths']['swr.cn-north-4.myhuaweicloud.com']['auth'])")
          SWR_USER=$(echo "$SWR_AUTH" | base64 -d | cut -d: -f1)
          SWR_PASS=$(echo "$SWR_AUTH" | base64 -d | cut -d: -f2)
          docker login -u "$SWR_USER" -p "$SWR_PASS" ${{ env.SWR_REGISTRY }}

      - name: Build and push eval image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.eval
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-eval:latest
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-eval:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
