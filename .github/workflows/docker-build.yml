name: Docker Build

on:
  push:
    branches: [main, master]
    paths:
      - docker/**
      - scripts/**
      - configs/**
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build-train:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push train image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-train:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-train:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-model-server:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push model-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.model-server
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-model-server:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-model-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-eval:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push eval image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.eval
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-eval:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-eval:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
