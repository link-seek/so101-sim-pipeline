name: Docker Build

on:
  push:
    branches: [main, master]
    paths:
      - docker/**
      - scripts/**
      - configs/**
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_NAMESPACE: link-seek

jobs:
  build-train:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push train image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-train:latest
            ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-train:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.HW_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.HW_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u cn-north-4@${{ secrets.HW_AK }} -p "$LOGIN_KEY" ${{ env.SWR_REGISTRY }}

      - name: Mirror to SWR
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-train:latest
          docker tag ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/so101-train:latest \
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-train:latest
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-train:latest

  build-model-server:
