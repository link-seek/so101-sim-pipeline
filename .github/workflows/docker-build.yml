name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'scripts/**'

permissions:
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: link-seek
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_NAMESPACE: link-seek

jobs:
  build-train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push train image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          push: true
          provenance: false
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-train:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push eval image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.eval
          push: true
          provenance: false
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-eval:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mirror-to-swr:
    needs: [build-train, build-eval]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" ${{ env.SWR_REGISTRY }}

      - name: Mirror train image
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-train:latest
          docker tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-train:latest \
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-train:latest
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-train:latest

      - name: Mirror eval image
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-eval:latest
          docker tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/so101-eval:latest \
            ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-eval:latest
          docker push ${{ env.SWR_REGISTRY }}/${{ env.SWR_NAMESPACE }}/so101-eval:latest
