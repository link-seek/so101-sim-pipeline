name: Split Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Download and split
        run: |
          wget -q "https://github.com/actions/runner/releases/download/v2.327.1/actions-runner-linux-x64-2.327.1.tar.gz" -O runner.tar.gz
          ls -lh runner.tar.gz
          sha256sum runner.tar.gz
          # Split into 5MB chunks
          split -b 5M runner.tar.gz chunk_
          ls -lh chunk_*
          
      - name: Upload chunks to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gh-runner-chunks
          files: chunk_*
