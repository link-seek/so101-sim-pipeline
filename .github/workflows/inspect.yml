name: Inspect Data State (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud
      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          # BatchStartServers is async AND silently drops the request if the box is
          # mid-transition (seen 3x: start lands in a stop window, run queues forever).
          # This loop: waits for quiescence, issues start (re-issues every ~4min if
          # dropped), and fails loudly if not active within 20min.
          ECS="${{ env.ECS_SERVER_ID }}"; AK="${{ secrets.OBS_AK }}"; SK="${{ secrets.OBS_SK }}"; RG="${{ env.ECS_REGION }}"
          st() { hcloud ECS ListServersDetails --cli-region="$RG" --limit=50 --cli-access-key="$AK" --cli-secret-key="$SK" 2>/dev/null | python3 -c "import json,sys; raw=sys.stdin.read(); d=json.loads(raw[raw.find('{'):]); s=[x for x in d.get('servers',[]) if x.get('id')=='$ECS']; print((s[0].get('OS-EXT-STS:vm_state','?')+'/'+str(s[0].get('OS-EXT-STS:task_state') or '')) if s else 'unknown')" 2>/dev/null || echo unknown; }
          LAST_START=-100; N=0; ST=unknown
          for i in $(seq 1 60); do
            ST=$(st); echo "[$i/60] $ST"
            case "$ST" in
              active/) echo "V100 active"; break ;;
              stopped/) if [ $((N-LAST_START)) -ge 12 ] || [ $N -eq 0 ]; then echo "issuing start"; echo "y" | hcloud ECS BatchStartServers --cli-region="$RG" --cli-access-key="$AK" --cli-secret-key="$SK" --os-start.servers.1.id="$ECS" >/dev/null 2>&1 || echo "start call failed, will retry"; LAST_START=$N; else echo "start already requested, waiting"; fi ;;
              */?*) echo "transition in progress, waiting" ;;
              *) echo "state unreadable, waiting" ;;
            esac
            N=$((N+1)); sleep 20
          done
          [ "$(st)" = "active/" ] || { echo "V100 did not reach active"; exit 1; }

  inspect:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 15
    steps:
      - name: Configure obsutil
        run: |
          obsutil config -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -e https://obs.cn-north-4.myhuaweicloud.com
      - name: Local disk state
        run: |
          echo "=== /data/datasets ==="
          find /data/datasets/libero_so101_expert_w0 /data/datasets/libero_so101_expert/libero_object -maxdepth 5 2>/dev/null; echo '=== DU ==='; du -sh /data/datasets/libero_so101_expert_w0 2>/dev/null || true 2>/dev/null | head -n 40
          echo "=== du ==="
          du -sh /data/datasets/* 2>/dev/null || true
          echo "=== checkpoints ==="
          ls /data/checkpoints/ 2>/dev/null || true
      - name: OBS bucket state
        run: |
          echo "=== OBS datasets ==="
          obsutil ls obs://${{ env.OBS_BUCKET }}/datasets/libero_so101_expert/ 2>&1 | head -n 40
          echo "=== OBS checkpoints ==="
          obsutil ls obs://${{ env.OBS_BUCKET }}/checkpoints/ 2>&1 | head -n 10

  stop-ecs:
    needs: inspect
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud
      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 60
          exit 0
