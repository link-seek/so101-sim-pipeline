name: PPO Pipeline

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: "Warp env id"
        required: false
        default: "WarpPickLift-v1"
      total_timesteps:
        description: "Training timesteps"
        required: false
        default: "30000000"
      num_envs:
        description: "Parallel envs"
        required: false
        default: "1024"
      seed:
        description: "Random seed"
        required: false
        default: "1"
      num_eval_episodes:
        description: "Eval episodes"
        required: false
        default: "50"
      lift_threshold:
        description: "Min lift height for success (m)"
        required: false
        default: "0.15"

permissions:
  contents: write
  packages: read

env:
  PPO_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-ppo:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 120

  ppo-pipeline:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 120
    steps:
      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Pull PPO image
        run: docker pull ${{ env.PPO_IMAGE }}

      - name: PPO Train
        run: |
          mkdir -p /data/checkpoints/ppo /data/ppo/results
          docker run --rm --gpus all --shm-size=8g \
            -v /data/checkpoints:/data/checkpoints \
            -v /data/ppo:/data/ppo \
            ${{ env.PPO_IMAGE }} \
            python /workspace/scripts/train_ppo.py \
              --env-id ${{ github.event.inputs.env_id }} \
              --total-timesteps ${{ github.event.inputs.total_timesteps }} \
              --num-envs ${{ github.event.inputs.num_envs }} \
              --seed ${{ github.event.inputs.seed }} \
              --save-dir /data/checkpoints/ppo \
              --result-path /data/ppo/results/train_result.json \
              --log-freq 10 \
              --lift-threshold ${{ github.event.inputs.lift_threshold }}

      - name: PPO Eval
        run: |
          docker run --rm --gpus all --shm-size=8g \
            -v /data/checkpoints:/data/checkpoints \
            -v /data/ppo:/data/ppo \
            ${{ env.PPO_IMAGE }} \
            python /workspace/scripts/eval_ppo.py \
              --checkpoint /data/checkpoints/ppo/best_agent.pt \
              --env-id ${{ github.event.inputs.env_id }} \
              --num-episodes ${{ github.event.inputs.num_eval_episodes }} \
              --output /data/ppo/results \
              --lift-threshold ${{ github.event.inputs.lift_threshold }}

      - name: Print results
        run: |
          echo "=== Train Result ==="
          cat /data/ppo/results/train_result.json 2>/dev/null || echo "Not found"
          echo "=== Eval Result ==="
          cat /data/ppo/results/eval_result.json 2>/dev/null || echo "Not found"

      - name: Upload to OBS
        if: always()
        run: |
          obsutil cp /data/ppo/results/ obs://${{ env.OBS_BUCKET }}/ppo/ -f -r -flat
          if [ -f /data/checkpoints/ppo/best_agent.pt ]; then
            obsutil cp /data/checkpoints/ppo/best_agent.pt obs://${{ env.OBS_BUCKET }}/ppo/checkpoints/best_agent.pt -f
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppo-results
          path: |
            /data/ppo/results/train_result.json
            /data/ppo/results/eval_result.json
            /data/ppo/results/eval_video.mp4

  stop-ecs:
    needs: ppo-pipeline
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 60
          exit 0
