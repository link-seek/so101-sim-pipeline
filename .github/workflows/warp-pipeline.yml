name: Warp Pipeline

on:
  workflow_dispatch:
    inputs:
      num_episodes:
        description: 'Number of data collection episodes'
        default: '50'
      num_envs:
        description: 'Number of Warp parallel envs'
        default: '64'
      train_steps:
        description: 'Training steps'
        default: '10000'
      num_eval_episodes:
        description: 'Number of evaluation episodes'
        default: '20'

permissions:
  contents: write

env:
  PYTHON: /data/so101-env/bin/python
  MUJOCO_GL: egl
  HF_ENDPOINT: https://hf-mirror.com
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  OBS_AK: ${{ secrets.OBS_AK }}
  OBS_SK: ${{ secrets.OBS_SK }}
  DATASET_REPO_WARP: xieyucheng123/so101-sim-picklift-warp
  HF_MODEL_REPO: xieyucheng123/so101-act-sim
  SCRIPTS_DIR: /data/pipeline/scripts
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  HCLOUD_AGREE_PRIVACY: true

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud
          echo "y" | hcloud --help | head -3

      - name: Start ECS 0002
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          echo "Waiting for server to become ACTIVE..."
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(echo "y" | hcloud ECS NovaShowServer \
              --cli-region="${{ env.ECS_REGION }}" \
              --cli-access-key="${{ secrets.OBS_AK }}" \
              --cli-secret-key="${{ secrets.OBS_SK }}" \
              --server_id="${{ env.ECS_SERVER_ID }}" \
              2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['server']['status'])" 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              echo "Server is ACTIVE. Waiting 30s for runner to connect..."
              sleep 30
              echo "Server ready."
              exit 0
            fi
          done
          echo "ERROR: Server did not become ACTIVE in 300s"
          exit 1

  warp-benchmark:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 30
    steps:
      - name: Checkout and sync scripts
        uses: actions/checkout@v4
        with:
          path: repo-checkout
      - name: Sync scripts to SCRIPTS_DIR
        run: |
          mkdir -p $SCRIPTS_DIR
          cp repo-checkout/scripts/*.py $SCRIPTS_DIR/
          ls $SCRIPTS_DIR/

      - name: Verify Warp environment
        run: |
          $PYTHON -c "import warp; print(f'warp={warp.__version__}')"
          $PYTHON -c "import mujoco_warp; print(f'mujoco_warp={mujoco_warp.__version__}')"
          $PYTHON -c "import so101_nexus; import so101_nexus.warp; print('so101_nexus.warp OK')"

      - name: Run Warp benchmark
        run: |
          $PYTHON $SCRIPTS_DIR/warp_benchmark.py \
            --num-envs 1,4,16,64,128 \
            --max-steps 500

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: warp-benchmark
          path: /data/pipeline/results/warp_benchmark.json

  collect-data-warp:
    needs: warp-benchmark
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 60
    steps:
      - name: Collect data with Warp
        run: |
          $PYTHON $SCRIPTS_DIR/collect_data_warp.py \
            --repo-id $DATASET_REPO_WARP \
            --num-episodes ${{ inputs.num_episodes }} \
            --num-envs ${{ inputs.num_envs }} \
            --max-steps 200

      - name: Upload collection report
        uses: actions/upload-artifact@v4
        with:
          name: warp-collect-report
          path: /data/pipeline/results/warp_collect_report.json

  train-act:
    needs: collect-data-warp
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 30
    steps:
      - name: Train ACT on Warp dataset
        run: |
          $PYTHON $SCRIPTS_DIR/train_act.py \
            --dataset-repo $DATASET_REPO_WARP \
            --train-steps ${{ inputs.train_steps }}

      - name: Upload training results
        uses: actions/upload-artifact@v4
        with:
          name: warp-training
          path: /data/pipeline/training/

  eval-mujoco:
    needs: train-act
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 60
    steps:
      - name: Evaluate on MuJoCo backend
        run: |
          $PYTHON $SCRIPTS_DIR/eval_sim.py \
            --num-episodes ${{ inputs.num_eval_episodes }}

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: warp-eval-mujoco
          path: /data/pipeline/results/eval_report.json

  stop-ecs:
    needs: eval-mujoco
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud
          echo "y" | hcloud --help | head -3

      - name: Stop ECS 0002
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          echo "Waiting for server to become SHUTOFF..."
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(echo "y" | hcloud ECS NovaShowServer \
              --cli-region="${{ env.ECS_REGION }}" \
              --cli-access-key="${{ secrets.OBS_AK }}" \
              --cli-secret-key="${{ secrets.OBS_SK }}" \
              --server_id="${{ env.ECS_SERVER_ID }}" \
              2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['server']['status'])" 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "SHUTOFF" ]; then
              echo "Server is SHUTOFF."
              exit 0
            fi
          done
          echo "WARNING: Server did not become SHUTOFF in 180s, but workflow continues."
          exit 0
