name: Warp Pipeline

on:
  workflow_dispatch:
    inputs:
      num_episodes:
        description: 'Number of data collection episodes'
        default: '50'
      num_envs:
        description: 'Number of Warp parallel envs'
        default: '64'
      train_steps:
        description: 'Training steps'
        default: '10000'
      num_eval_episodes:
        description: 'Number of evaluation episodes'
        default: '20'

permissions:
  contents: write

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_NAMESPACE: hwstaff_l00392796
  TRAIN_IMAGE: swr.cn-north-4.myhuaweicloud.com/hwstaff_l00392796/so101-train:latest
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/hwstaff_l00392796/so101-eval:latest
  DATASET_REPO_WARP: xieyucheng123/so101-sim-picklift-warp
  HF_MODEL_REPO: xieyucheng123/so101-act-sim
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(echo "y" | hcloud ECS NovaShowServer \
              --cli-region="${{ env.ECS_REGION }}" \
              --cli-access-key="${{ secrets.OBS_AK }}" \
              --cli-secret-key="${{ secrets.OBS_SK }}" \
              --server_id="${{ env.ECS_SERVER_ID }}" \
              2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['server']['status'])" 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "ACTIVE" ]; then
              sleep 30
              exit 0
            fi
          done
          exit 1

  warp-pipeline:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 120
    steps:
      - name: Login to SWR
        run: |
          echo "${{ secrets.OBS_SK }}" | docker login -u cn-north-4@${{ secrets.OBS_AK }} --password-stdin ${{ env.SWR_REGISTRY }}

      - name: Pull Docker images
        run: |
          docker pull ${{ env.TRAIN_IMAGE }}
          docker pull ${{ env.EVAL_IMAGE }}

      - name: Run Warp benchmark
        run: |
          docker run --rm --gpus all -v /data:/data \
            -e MUJOCO_GL=egl -e HF_ENDPOINT=https://hf-mirror.com \
            ${{ env.TRAIN_IMAGE }} \
            python /scripts/warp_benchmark.py --num-envs 1,4,16,64,128 --max-steps 500

      - name: Collect data with Warp
        run: |
          docker run --rm --gpus all -v /data:/data \
            -e MUJOCO_GL=egl -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            ${{ env.TRAIN_IMAGE }} \
            python /scripts/collect_data_warp.py \
              --repo-id ${{ env.DATASET_REPO_WARP }} \
              --num-episodes ${{ inputs.num_episodes }} \
              --num-envs ${{ inputs.num_envs }} \
              --max-steps 200

      - name: Train ACT on Warp dataset
        run: |
          docker run --rm --gpus all -v /data:/data \
            -e MUJOCO_GL=egl -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            ${{ env.TRAIN_IMAGE }} \
            python /scripts/train_act.py \
              --dataset-repo ${{ env.DATASET_REPO_WARP }} \
              --train-steps ${{ inputs.train_steps }}

      - name: Evaluate on MuJoCo backend
        run: |
          docker run --rm --gpus all -v /data:/data \
            -e MUJOCO_GL=egl -e HF_ENDPOINT=https://hf-mirror.com \
            ${{ env.EVAL_IMAGE }} \
            python /scripts/eval_sim.py --num-episodes ${{ inputs.num_eval_episodes }}

      - name: Upload to OBS + HF
        if: always()
        run: |
          docker run --rm --gpus all -v /data:/data \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            -e OBS_AK=${{ secrets.OBS_AK }} -e OBS_SK=${{ secrets.OBS_SK }} \
            ${{ env.EVAL_IMAGE }} \
            python /scripts/upload_results.py \
              --hf-token ${{ secrets.HF_TOKEN }} \
              --hf-repo ${{ env.HF_MODEL_REPO }} \
              --obs-ak ${{ secrets.OBS_AK }} \
              --obs-sk ${{ secrets.OBS_SK }}

      - name: Generate OBS download link
        if: always()
        run: |
          docker run --rm --gpus all -v /data:/data \
            -e OBS_AK=${{ secrets.OBS_AK }} -e OBS_SK=${{ secrets.OBS_SK }} \
            ${{ env.EVAL_IMAGE }} \
            python /scripts/generate_obs_link.py \
              --model-path /data/pipeline/training/checkpoints/last/pretrained_model \
              --output /data/pipeline/download_link.txt

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warp-results
          path: |
            /data/pipeline/results/*.json
            /data/pipeline/results/*.png
            /data/pipeline/download_link.txt

  stop-ecs:
    needs: warp-pipeline
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          for i in $(seq 1 18); do
            sleep 10
            STATUS=$(echo "y" | hcloud ECS NovaShowServer \
              --cli-region="${{ env.ECS_REGION }}" \
              --cli-access-key="${{ secrets.OBS_AK }}" \
              --cli-secret-key="${{ secrets.OBS_SK }}" \
              --server_id="${{ env.ECS_SERVER_ID }}" \
              2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['server']['status'])" 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "SHUTOFF" ]; then
              exit 0
            fi
          done
          exit 0
