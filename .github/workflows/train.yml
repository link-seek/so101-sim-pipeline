name: Train

on:
  workflow_dispatch:
    inputs:
      dataset_repo:
        description: "HF dataset repo (user/dataset_name)"
        required: true
        default: "xieyucheng123/so101-dataset"
      model_repo:
        description: "HF model repo (user/model_name)"
        required: true
        default: "xieyucheng123/so101-act"
      policy_type:
        description: "Policy type (act/diffusion/smolvla)"
        required: true
        default: "act"
      training_steps:
        description: "Training steps"
        required: true
        default: "20000"
  repository_dispatch:
    types: [train-trigger]

jobs:
  trigger-kaggle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q nbformat requests huggingface_hub

      - name: Prepare and push notebook to Kaggle
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Inject parameters into notebook (no secrets embedded in source)
          python3 scripts/prepare_kaggle_notebook.py \
            --dataset "${{ github.event.inputs.dataset_repo || 'xieyucheng123/so101-dataset' }}" \
            --model "${{ github.event.inputs.model_repo || 'xieyucheng123/so101-act' }}" \
            --policy "${{ github.event.inputs.policy_type || 'act' }}" \
            --steps "${{ github.event.inputs.training_steps || '20000' }}" \
            --hf-token "$HF_TOKEN"

          # Push to Kaggle via Bearer token API
          python3 scripts/kaggle_push.py \
            --notebook kaggle-notebook/train_act.ipynb \
            --token "$KAGGLE_KEY" \
            --slug "xieyucheng123/so101-train-act" \
            --title "so101-train-act"

          # Set HF_TOKEN as Kaggle secret (not embedded in notebook source)
          curl -s -X POST \
            -H "Authorization: Bearer $KAGGLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"HF_TOKEN\",\"value\":\"$HF_TOKEN\"}" \
            "https://www.kaggle.com/api/v1/kernels/secrets?user_name=xieyucheng123&slug=so101-train-act" \
            || echo "Warning: Could not set Kaggle secret (may need manual setup)"

      - name: Wait for Kaggle completion
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          SLUG_USER="xieyucheng"
          SLUG_KERNEL="so101-train-act"
          echo "Waiting for Kaggle kernel $SLUG_USER/$SLUG_KERNEL to complete..."
          
          for i in $(seq 1 120); do
            STATUS=$(curl -s -H "Authorization: Bearer $KAGGLE_KEY" \
              "https://www.kaggle.com/api/v1/kernels/status?user_name=$SLUG_USER&slug=$SLUG_KERNEL" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "complete" ]; then
              echo "Kaggle training completed!"
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "Kaggle training failed!"
              exit 1
            fi
            sleep 60
          done
          echo "Timeout waiting for Kaggle"
          exit 1

      - name: Trigger evaluation
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: evaluate-trigger
          client-payload: |
            {
              "model_repo": "${{ github.event.inputs.model_repo || 'xieyucheng123/so101-act' }}",
              "dataset_repo": "${{ github.event.inputs.dataset_repo || 'xieyucheng123/so101-dataset' }}"
            }
