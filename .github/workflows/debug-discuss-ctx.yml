name: Debug Discuss Ctx (temporary)

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: read

jobs:
  ctx:
    runs-on: ubuntu-latest
    steps:
      - name: Dump trigger context (no secrets)
        env:
          EV_NAME: ${{ github.event_name }}
          ASSOC_C: ${{ github.event.comment.author_association }}
          ASSOC_D: ${{ github.event.discussion.author_association }}
          BODY_C: ${{ github.event.comment.body }}
          BODY_D: ${{ github.event.discussion.body }}
        run: |
          echo "event_name=$EV_NAME"
          echo "comment.association=$ASSOC_C"
          echo "discussion.association=$ASSOC_D"
          echo "comment.body.head=${BODY_C:0:60}"
          echo "discussion.body.head=${BODY_D:0:60}"
