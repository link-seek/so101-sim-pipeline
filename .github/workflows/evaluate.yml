name: Evaluate

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Checkpoint path"
        required: true
        default: "/data/checkpoints/smolvla-sim/checkpoints/015000/pretrained_model"
      benchmarks:
        description: "Comma-separated benchmark names"
        required: false
        default: "libero_spatial,libero_object,libero_goal"
      episodes_per_task:
        description: "Episodes per task"
        required: false
        default: "10"

permissions:
  contents: write
  packages: read

env:
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-eval:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 120

  evaluate:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 1800
    strategy:
      matrix:
        gpu: [0, 1]
    steps:
      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Setup evaluation
        run: |
          mkdir -p /data/eval/libero_results
          docker pull ${{ env.EVAL_IMAGE }}

      - name: Split benchmarks
        id: split
        run: |
          BENCHMARKS="${{ inputs.benchmarks }}"
          IFS=',' read -ra SUITES <<< "$BENCHMARKS"
          NUM=${#SUITES[@]}
          HALF=$(( (NUM + 1) / 2 ))
          GPU0=$(IFS=','; echo "${SUITES[*]:0:HALF}")
          GPU1=$(IFS=','; echo "${SUITES[*]:HALF}")
          if [ "${{ matrix.gpu }}" = "0" ]; then
            echo "suites=$GPU0" >> $GITHUB_OUTPUT
          else
            echo "suites=$GPU1" >> $GITHUB_OUTPUT
          fi

      - name: Run LIBERO evaluation with SO101 (GPU ${{ matrix.gpu }})
        run: |
          SUITES="${{ steps.split.outputs.suites }}"
          if [ -z "$SUITES" ]; then
            echo "No suites for GPU ${{ matrix.gpu }}, skipping"
            exit 0
          fi
          echo "Running suites: $SUITES on GPU ${{ matrix.gpu }}"
          docker run --rm --gpus "device=${{ matrix.gpu }}" --shm-size=8g \
            -v /data:/data \
            -e CUDA_VISIBLE_DEVICES=0 \
            -e MUJOCO_GL=egl \
            -e MUJOCO_EGL_DEVICE_ID=0 \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_HUB_DISABLE_XET=1 \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            ${{ env.EVAL_IMAGE }} \
            python /workspace/scripts/run_libero_eval.py \
              --checkpoint '${{ inputs.checkpoint }}' \
              --benchmarks "$SUITES" \
              --episodes_per_task ${{ inputs.episodes_per_task }} \
              --output_dir /data/eval/libero_results/gpu_${{ matrix.gpu }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libero-eval-results-gpu-${{ matrix.gpu }}
          path: /data/eval/libero_results/gpu_${{ matrix.gpu }}/

  merge-results:
    needs: evaluate
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 10
    steps:
      - name: Merge results
        run: |
          python3 -c "
          import json, glob, os
          all_results = []
          for d in glob.glob('/data/eval/libero_results/gpu_*'):
              f = os.path.join(d, 'libero_eval_summary.json')
              if os.path.exists(f):
                  with open(f) as fh:
                      data = json.load(fh)
                  all_results.extend(data.get('per_episode', []))
          summary = {
              'total_episodes': len(all_results),
              'total_successes': sum(r['success'] for r in all_results),
              'overall_success_rate': sum(r['success'] for r in all_results) / len(all_results) if all_results else 0,
              'per_suite': {},
              'per_episode': all_results,
          }
          for suite in set(r['suite'] for r in all_results):
              sr = [r for r in all_results if r['suite'] == suite]
              summary['per_suite'][suite] = {
                  'success_rate': sum(r['success'] for r in sr) / len(sr),
                  'num_episodes': len(sr),
                  'num_successes': sum(r['success'] for r in sr),
              }
              print(f'{suite}: {sum(r[\"success\"] for r in sr)}/{len(sr)} = {sum(r[\"success\"] for r in sr)/len(sr):.1%}')
          with open('/data/eval/libero_results/libero_eval_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          print(f'Overall: {summary[\"total_successes\"]}/{summary[\"total_episodes\"]} = {summary[\"overall_success_rate\"]:.1%}')
          "

      - name: Upload to OBS
        run: |
          obsutil cp /data/eval/libero_results/ obs://${{ env.OBS_BUCKET }}/eval/libero/ -f -r -flat

      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libero-eval-results
          path: /data/eval/libero_results/libero_eval_summary.json

  stop-ecs:
    needs: merge-results
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 60
          exit 0
