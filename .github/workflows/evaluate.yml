name: Evaluate

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Checkpoint path"
        required: true
        default: "/data/checkpoints/smolvla-sim/checkpoints/015000/pretrained_model"
      benchmarks:
        description: "Comma-separated benchmark names"
        required: false
        default: "libero_spatial,libero_object,libero_goal"
      episodes_per_task:
        description: "Episodes per task"
        required: false
        default: "50"

permissions:
  contents: write
  packages: read

env:
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-eval:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStartServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-start.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 120

  evaluate:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 1800
    steps:
      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup evaluation
        run: |
          mkdir -p /data/eval/libero_results
          docker pull ${{ env.EVAL_IMAGE }}

      - name: Run LIBERO evaluation with SO101
        run: |
          docker run --rm --gpus all --shm-size=8g \
            -v /data:/data \
            -v $(pwd)/scripts:/workspace/scripts \
            -v $(pwd)/robosuite_so101:/workspace/robosuite_so101 \
            -e MUJOCO_GL=egl \
            -e HF_ENDPOINT=https://hf-mirror.com \
            -e HF_HUB_DISABLE_XET=1 \
            -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
            ${{ env.EVAL_IMAGE }} \
            python /workspace/scripts/run_libero_eval.py \
              --checkpoint '${{ inputs.checkpoint }}' \
              --benchmarks '${{ inputs.benchmarks }}' \
              --episodes_per_task ${{ inputs.episodes_per_task }} \
              --output_dir /data/eval/libero_results

      - name: Upload to OBS
        run: |
          obsutil cp /data/eval/libero_results/ obs://${{ env.OBS_BUCKET }}/eval/libero/ -f -r -flat

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libero-eval-results
          path: /data/eval/libero_results/

  stop-ecs:
    needs: evaluate
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 60
          exit 0
