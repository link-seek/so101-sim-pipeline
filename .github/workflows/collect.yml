name: Collect Expert Data

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "LIBERO suite"
        required: false
        default: "libero_object"
      tasks:
        description: "Comma-separated task indices (empty = all)"
        required: false
        default: ""
      episodes_per_task:
        description: "Episodes per task"
        required: false
        default: "5"
      output_suffix:
        description: "Suffix for output dir (per-leg sharding, e.g. _g0). Empty = legacy path"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

env:
  EVAL_IMAGE: swr.cn-north-4.myhuaweicloud.com/link-seek/so101-eval:latest
  ECS_SERVER_ID: 7f39cb83-1a5c-4792-b65e-e578d7ddb88d
  ECS_REGION: cn-north-4
  OBS_BUCKET: so101-sim-pipeline

jobs:
  start-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Start ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          # BatchStartServers is async AND silently drops the request if the box is
          # mid-transition (seen 3x: start lands in a stop window, run queues forever).
          # This loop: waits for quiescence, issues start (re-issues every ~4min if
          # dropped), and fails loudly if not active within 20min.
          ECS="${{ env.ECS_SERVER_ID }}"; AK="${{ secrets.OBS_AK }}"; SK="${{ secrets.OBS_SK }}"; RG="${{ env.ECS_REGION }}"
          st() { OUT=$(echo "y" | hcloud ECS ListServersDetails --cli-region="$RG" --limit=50 --cli-access-key="$AK" --cli-secret-key="$SK" 2>&1); echo "$OUT" | grep -q "{" || { echo "hcloud-bad: $(echo "$OUT" | head -c 200)" >&2; echo unknown; return 0; }; echo "$OUT" | python3 -c "import json,sys; raw=sys.stdin.read(); d=json.loads(raw[raw.find(chr(123)):]); s=[x for x in d.get('servers',[]) if x.get('id')=='$ECS']; print((s[0].get('OS-EXT-STS:vm_state','?')+'/'+str(s[0].get('OS-EXT-STS:task_state') or '')) if s else 'unknown')" 2>&1 || echo unknown; }
          LAST_START=-100; N=0; ST=unknown
          for i in $(seq 1 60); do
            ST=$(st); echo "[$i/60] $ST"
            case "$ST" in
              active/) echo "V100 active"; break ;;
              stopped/) if [ $((N-LAST_START)) -ge 12 ] || [ $N -eq 0 ]; then echo "issuing start"; echo "y" | hcloud ECS BatchStartServers --cli-region="$RG" --cli-access-key="$AK" --cli-secret-key="$SK" --os-start.servers.1.id="$ECS" >/dev/null 2>&1 || echo "start call failed, will retry"; LAST_START=$N; else echo "start already requested, waiting"; fi ;;
              */?*) echo "transition in progress, waiting" ;;
              *) echo "state unreadable, waiting" ;;
            esac
            N=$((N+1)); sleep 20
          done
          [ "$(st)" = "active/" ] || { echo "V100 did not reach active"; exit 1; }

  collect:
    needs: start-ecs
    runs-on: [self-hosted, Linux, X64, V100]
    timeout-minutes: 600
    strategy:
      matrix:
        # Per-leg output dirs (see output_suffix): legs must NOT share one suite dir
        # (save_dataset() rmtree()s it per leg). Merge afterwards via merge.yml.
        gpu: [0, 1]
    steps:
      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OBS_AK }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OBS_SK }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          docker login -u "cn-north-4@${{ secrets.OBS_AK }}" -p "$LOGIN_KEY" swr.cn-north-4.myhuaweicloud.com

      - name: Cleanup docker (ECS disk fills with old layers)
        run: |
          docker system df || true
          docker container prune -f || true
          docker image prune -af --filter "until=24h" || true
          docker builder prune -af || true
          df -h / || true

      - name: Pull latest image
        run: docker pull ${{ env.EVAL_IMAGE }}

      - name: Configure obsutil
        run: |
          obsutil config -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -e https://obs.cn-north-4.myhuaweicloud.com
          obsutil ls obs://${{ env.OBS_BUCKET }}/ 2>&1 | head -n 5 || true

      - name: Collect expert demonstrations (GPU ${{ matrix.gpu }})
        run: |
          TASKS="${{ inputs.tasks }}"
          if [ -n "$TASKS" ]; then
            # split task list between GPUs
            IFS=',' read -ra T <<< "$TASKS"
            NUM=${#T[@]}
            HALF=$(( (NUM + 1) / 2 ))
            if [ "${{ matrix.gpu }}" = "0" ]; then
              MY=$(IFS=','; echo "${T[*]:0:HALF}")
            else
              MY=$(IFS=','; echo "${T[*]:HALF}")
            fi
            [ -z "$MY" ] && { echo "no tasks for gpu"; exit 0; }
          else
            MY=""
          fi
          # stale root-owned output? clear via container-as-root (runner has no sudo)
          rm -rf /data/datasets/libero_so101_expert${{ inputs.output_suffix }}-g${{ matrix.gpu }}/'${{ inputs.suite }}' 2>/dev/null || \
            docker run --rm -v /data:/data ${{ env.EVAL_IMAGE }} rm -rf /data/datasets/libero_so101_expert${{ inputs.output_suffix }}-g${{ matrix.gpu }}/'${{ inputs.suite }}'
          # /data is root-owned: new per-leg dirs must be created as root (runner has no sudo)
          docker run --rm -v /data:/data ${{ env.EVAL_IMAGE }} mkdir -p /data/datasets/libero_so101_expert${{ inputs.output_suffix }}-g${{ matrix.gpu }}/'${{ inputs.suite }}'
          mkdir -p "${RUNNER_TEMP}/scripts"
          for f in collect_libero_expert.py run_libero_eval.py; do
            curl -sfL --max-time 60 -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/scripts/${f}?ref=smolvla-fresh" \
              | python3 -c "import sys,json,base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)['content']).decode())" \
              > "${RUNNER_TEMP}/scripts/${f}"
          done
          wc -l "${RUNNER_TEMP}/scripts/"*.py
          date '+[%F %T] pkg fetch start'
          mkdir -p "${RUNNER_TEMP}/pkg"
          if timeout -k 60 600 git clone --depth 1 --branch smolvla-fresh --filter=blob:none --sparse \
              "https://github.com/${{ github.repository }}.git" "${RUNNER_TEMP}/pkg/so101pkg" 2>/dev/null; then
            timeout -k 60 600 git -C "${RUNNER_TEMP}/pkg/so101pkg" sparse-checkout set robosuite_so101
          else
            curl -sfL --max-time 300 -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/tarball/smolvla-fresh" \
              | tar -xz -C "${RUNNER_TEMP}/pkg" --strip-components=1 --wildcards '*/robosuite_so101'
          fi
          PKG=$(dirname $(find "${RUNNER_TEMP}/pkg" -maxdepth 3 -name so101_robot.py | head -n 1))
          test -n "$PKG" && ls "$PKG"
          date '+[%F %T] pkg ready'
          date '+[%F %T] collect start'
          timeout -k 300 28800 docker run --rm --gpus "device=${{ matrix.gpu }}" --shm-size=8g \
            -v /data:/data \
            -v "${RUNNER_TEMP}/scripts/collect_libero_expert.py:/workspace/scripts/collect_libero_expert.py:ro" \
            -v "${RUNNER_TEMP}/scripts/run_libero_eval.py:/workspace/scripts/run_libero_eval.py:ro" \
            -v "${PKG}:/workspace/robosuite_so101:ro" \
            -e MY="$MY" \
            -e CUDA_VISIBLE_DEVICES=0 \
            -e MUJOCO_GL=egl \
            -e HF_ENDPOINT=https://hf-mirror.com \
            ${{ env.EVAL_IMAGE }} \
            bash -c ' set -e;
              date "+[%F %T] asset install";
              ROBOSUITE_ASSETS=$(python -c "import robosuite, os; print(os.path.join(os.path.dirname(robosuite.__file__), \"models\", \"assets\"))");
              mkdir -p $ROBOSUITE_ASSETS/robots/so101/meshes $ROBOSUITE_ASSETS/grippers/meshes/so101_gripper;
              cp /workspace/robosuite_so101/robots/so101/robot.xml $ROBOSUITE_ASSETS/robots/so101/;
              cp -r /workspace/robosuite_so101/robots/so101/meshes/* $ROBOSUITE_ASSETS/robots/so101/meshes/;
              cp /workspace/robosuite_so101/grippers/so101_gripper.xml $ROBOSUITE_ASSETS/grippers/;
              cp -r /workspace/robosuite_so101/grippers/meshes/so101_gripper/* $ROBOSUITE_ASSETS/grippers/meshes/so101_gripper/;
              ROBOSUITE_CTRL=$(python -c "import robosuite, os; print(os.path.join(os.path.dirname(robosuite.__file__), \"controllers\", \"configs\", \"robots\"))");
              mkdir -p $ROBOSUITE_CTRL;
              cp /workspace/robosuite_so101/controllers/so101_basic.json $ROBOSUITE_CTRL/default_so101.json;
              date "+[%F %T] asset done"; pip install -q "lerobot[dataset]==0.6.1" && python /workspace/scripts/collect_libero_expert.py \
              --suite "${{ inputs.suite }}" \
              --tasks "$MY" \
              --episodes_per_task ${{ inputs.episodes_per_task }} \
              --output_dir /data/datasets/libero_so101_expert${{ inputs.output_suffix }}-g${{ matrix.gpu }}'
          date '+[%F %T] collect done' 

      - name: Fix perms (container wrote root-only 0600; runner uploads)
        run: |
          docker run --rm -v /data:/data ${{ env.EVAL_IMAGE }} chmod -R a+rX "/data/datasets/libero_so101_expert${{ inputs.output_suffix }}-g${{ matrix.gpu }}/" || true

      - name: Upload dataset to OBS
        run: |
          obsutil cp /data/datasets/libero_so101_expert${{ inputs.output_suffix }}-g${{ matrix.gpu }}/ obs://${{ env.OBS_BUCKET }}/datasets/libero_so101_expert${{ inputs.output_suffix }}-g${{ matrix.gpu }}/ -f -r -flat || true

  stop-ecs:
    needs: collect
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Setup hcloud CLI
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          tar -xzf /tmp/hcloud.tar.gz -C /tmp/
          sudo mv /tmp/hcloud /usr/local/bin/hcloud

      - name: Stop ECS
        env:
          HCLOUD_AGREE_PRIVACY: "true"
        run: |
          echo "y" | hcloud ECS BatchStopServers \
            --cli-region="${{ env.ECS_REGION }}" \
            --cli-access-key="${{ secrets.OBS_AK }}" \
            --cli-secret-key="${{ secrets.OBS_SK }}" \
            --os-stop.servers.1.id="${{ env.ECS_SERVER_ID }}"
          sleep 60
          exit 0
