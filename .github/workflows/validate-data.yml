name: Validate Dataset Quality (CPU)

on:
  workflow_dispatch:
    inputs:
      src_prefix:
        description: "OBS datasets/ prefix to validate (merge uploads basename libero_object)"
        required: false
        default: "datasets/libero_object"
      min_eps:
        description: "Min episodes per task"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write

env:
  OBS_BUCKET: so101-sim-pipeline

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Setup obsutil
        run: |
          curl -sSL "https://cn-north-4-hdn-koocli.obs.cn-north-4.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz || true
          curl -sSL "https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz" -o /tmp/obsutil.tar.gz
          tar -xzf /tmp/obsutil.tar.gz -C /tmp/
          sudo mv /tmp/obsutil_linux_amd64_*/obsutil /usr/local/bin/obsutil
          obsutil config -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -e https://obs.cn-north-4.myhuaweicloud.com
      - name: Download dataset from OBS
        run: |
          mkdir -p /tmp/data
          obsutil cp obs://${{ env.OBS_BUCKET }}/${{ inputs.src_prefix }}/ /tmp/data/ -f -r
          find /tmp/data -maxdepth 2 | head -n 20
      - name: Fetch validator script
        run: |
          mkdir -p "${RUNNER_TEMP}/scripts"
          curl -sfL --max-time 60 -H "Authorization: token ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/scripts/validate_libero_data.py?ref=smolvla-fresh" \
            | python3 -c "import sys,json,base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)['content']).decode())" \
            > "${RUNNER_TEMP}/scripts/validate_libero_data.py"
      - name: Run validation
        run: |
          pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple "lerobot[dataset]==0.6.1" pillow || pip install -q "lerobot[dataset]==0.6.1" pillow
          INFO=$(find /tmp/data -path "*meta/info.json" | head -n 1)
          [ -n "$INFO" ] || { echo "no meta/info.json under /tmp/data"; exit 1; }
          ROOT=$(dirname "$(dirname "$INFO")")
          echo "DATASET_ROOT=$ROOT"
          python3 "${RUNNER_TEMP}/scripts/validate_libero_data.py" --root "$ROOT" --out-dir /tmp/report --min-eps "${{ inputs.min_eps }}"
      - name: Dump normalization stats
        run: |
          INFO=$(find /tmp/data -path "*meta/info.json" | head -n 1)
          ROOT=$(dirname "$(dirname "$INFO")")
          echo "DATASET_ROOT=$ROOT"
          python3 -c "
          import json
          s = json.load(open('$ROOT/meta/stats.json'))
          for k in ['action', 'observation.state']:
              if k in s:
                  v = s[k]
                  print(f'== {k} ==')
                  for stat in ['mean', 'std', 'min', 'max', 'q01', 'q99']:
                      if stat in v:
                          print(f'  {stat}: {v[stat]}')
          "
      - name: Build markdown report
        if: always()
        run: |
          python3 - <<'EOF'
          import json, glob, os
          r = json.load(open('/tmp/report/report.json'))
          L = [f"# 数据质量报告：{os.environ.get('SRC_PREFIX', 'wfinal')}", "",
               f"- 条数：{r['num_episodes']}，帧数：{r['num_frames']}，fps：{r['fps']}", "",
               "| 任务 | 条数 | 条长 min-均值-max |", "|---|---|---|"]
          for task, s in sorted(r['tasks'].items()):
              L.append(f"| {task} | {s['episodes']} | {s['len_min']}-{s['len_mean']}-{s['len_max']} |")
          L += ["", f"坏条：{len(r['bad_episodes'])}"]
          for b in r.get('bad_episodes', [])[:20]:
              L.append(f"- ep={b['ep']} {b['reason']}")
          L += ["", "## 抽帧（一任务三张：首/中/尾）", ""]
          for f in sorted(glob.glob('/tmp/report/samples/*.png')):
              L.append(f"- {os.path.basename(f)}")
          L += ["", "结论：PASS 可训" if not r.get('bad_episodes') else "结论：有坏条，见上表"]
          open('/tmp/report/validation-report.md', 'w').write('\n'.join(L))
          print('\n'.join(L))
          EOF
      - name: Upload report
        if: always()
        run: |
          obsutil cp /tmp/report/ obs://${{ env.OBS_BUCKET }}/reports/validation/ -f -r || true
          obsutil config -i "${{ secrets.OBS_AK }}" -k "${{ secrets.OBS_SK }}" -e https://obs.cn-north-9.myhuaweicloud.com
          obsutil cp /tmp/report/validation-report.md obs://xieyucheng/模拟/报告/validation-report.md -f || true
          obsutil cp /tmp/report/samples/ obs://xieyucheng/模拟/报告/samples/ -f -r -flat || true
      - name: Stitch sample videos
        if: always()
        run: |
          sudo apt-get install -y -q ffmpeg 2>&1 | tail -n 1 || true
          python3 - <<'EOF'
          import glob, os, subprocess
          files = sorted(glob.glob('/tmp/report/samples/*.png'))
          groups = {}
          for f in files:
              # name format: <task>_ep<N>_<tag>.png ; tag is first|mid|last
              base = os.path.basename(f)[:-4]
              tag = base.rsplit('_', 1)[-1]
              key = base[:-(len(tag) + 1)]
              groups.setdefault(key, {})[tag] = f
          for key, g in sorted(groups.items()):
              ordered = [g.get('first'), g.get('mid'), g.get('last')]
              ordered = [x for x in ordered if x]
              if not ordered:
                  continue
              lst = f'/tmp/_vid_{abs(hash(key))}.txt'
              with open(lst, 'w') as fh:
                  for x in ordered:
                      fh.write(f"file '{x}'\nduration 0.6\n")
                  fh.write(f"file '{ordered[-1]}'\n")
              out = f'/tmp/report/vid_{key[:30]}.mp4'
              subprocess.run(['ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', lst,
                              '-c:v', 'libx264', '-pix_fmt', 'yuv420p', out],
                             capture_output=True)
              print('stitched', out)
          EOF
          ls /tmp/report/*.mp4 2>/dev/null || echo "no videos"
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-samples
          path: /tmp/report/
